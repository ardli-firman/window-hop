[package]
name = "window-hop"
version = "0.1.0"
edition = "2021"
authors = ["Window Hop Contributors"]
description = "Window Hop multi-display queue browser manager"

[[bin]]
name = "window-hop"
path = "src/main.rs"

[[bin]]
name = "window-hop-installer"
path = "src/bin/installer.rs"

[dependencies]
async-channel = "2.5"
gpui-kit = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
